<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <linearGradient id="capeGradEmerald" x1="45" y1="10" x2="135" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="45%" stopColor="#10b981" />
      <stop offset="85%" stopColor="#059669" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>
    <linearGradient id="capeHighlightEmerald" x1="50" y1="12" x2="110" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#a7f3d0" stopOpacity="0.95" />
      <stop offset="100%" stopColor="#34d399" stopOpacity="0.3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10b981" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="translate(0, 18)" filter="url(#glow)">
    <!-- 1. BACK CAPE (Heroic emerald cape billowing to the right) -->
    <path
      d="M 52 14 
         C 65 7, 85 10, 102 24
         C 114 34, 126 42, 137 49
         C 126 53, 116 57, 107 63
         C 118 69, 128 73, 136 78
         C 122 84, 106 88, 92 84
         C 80 81, 74 74, 69 66
         C 66 75, 62 82, 57 88
         L 52 82
         Z"
      fill="url(#capeGradEmerald)"
      stroke="#047857"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />

    <!-- Cape creases -->
    <path d="M 72 26 C 86 42, 102 54, 124 59" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 76 35 C 89 54, 100 66, 116 73" stroke="#047857" stroke-width="2" stroke-linecap="round" />
    <path d="M 68 48 C 76 63, 85 75, 96 82" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 58 17 C 72 13, 94 22, 112 33 C 123 40, 130 46, 134 48" stroke="url(#capeHighlightEmerald)" stroke-width="2.5" stroke-linecap="round" />

    <!-- 2. RESUME DOCUMENT SHEET -->
    <rect
      x="12"
      y="11"
      width="56"
      height="84"
      rx="7"
      ry="7"
      fill="#ffffff"
      stroke="#0f172a"
      stroke-width="3.5"
      stroke-linejoin="round"
    />

    <!-- Avatar circle -->
    <circle cx="31" cy="30" r="10" fill="#ecfdf5" />
    <circle cx="31" cy="27.5" r="4" fill="#0f172a" />
    <path d="M 23.5 37.5 C 24 33, 27 32, 31 32 C 35 32, 38 33, 38.5 37.5 Z" fill="#0f172a" />

    <!-- Header bars -->
    <rect x="46" y="25" width="16" height="3.5" rx="1.75" fill="#0f172a" />
    <rect x="46" y="32" width="16" height="3" rx="1.5" fill="#10b981" />

    <!-- Divider bar -->
    <rect x="18" y="45" width="44" height="3.5" rx="1.75" fill="#0f172a" />

    <!-- Body content bars -->
    <rect x="18" y="53" width="44" height="2.8" rx="1.4" fill="#64748b" />
    <rect x="18" y="59.5" width="44" height="2.8" rx="1.4" fill="#64748b" />

    <!-- Bullet items -->
    <circle cx="20.5" cy="69" r="2.2" fill="#0f172a" />
    <rect x="26.5" y="67.8" width="35.5" height="2.6" rx="1.3" fill="#94a3b8" />

    <circle cx="20.5" cy="75.5" r="2.2" fill="#0f172a" />
    <rect x="26.5" y="74.3" width="35.5" height="2.6" rx="1.3" fill="#94a3b8" />

    <circle cx="20.5" cy="82" r="2.2" fill="#0f172a" />
    <rect x="26.5" y="80.8" width="26" height="2.6" rx="1.3" fill="#94a3b8" />

    <!-- 3. CAPE COLLAR & SHOULDERS -->
    <path
      d="M 9 17 C 8 9, 16 3, 26 8 C 32 11, 35 16, 27 18 C 19 20, 11 23, 9 17 Z"
      fill="url(#capeGradEmerald)"
      stroke="#047857"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path
      d="M 33 17 C 41 8, 59 3, 71 8 C 77 11, 75 18, 64 19 C 52 20, 42 22, 33 17 Z"
      fill="url(#capeGradEmerald)"
      stroke="#047857"
      stroke-width="3"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    <path d="M 13 14 C 18 10, 24 11, 28 14" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 40 14 C 49 8, 60 8, 66 12" stroke="#a7f3d0" stroke-width="1.8" stroke-linecap="round" />
  </g>
</svg>
