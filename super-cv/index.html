    <script>
      // Guard against libraries attempting to reassign window.fetch when it has only a getter
      (function() {
        try {
          var target = window;
          var proto = Object.getPrototypeOf(window);
          var desc = Object.getOwnPropertyDescriptor(target, 'fetch') || (proto && Object.getOwnPropertyDescriptor(proto, 'fetch'));
          if (desc && (!desc.writable || !desc.set)) {
            var currentFetch = window.fetch.bind(window);
            Object.defineProperty(window, 'fetch', {
              get: function() { return currentFetch; },
              set: function(fn) { currentFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // Gracefully continue
        }
      })();
    </script>
